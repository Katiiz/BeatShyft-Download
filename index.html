<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeatShyft</title>
  <meta
    name="description"
    content="Bring your favorite music to BeatShyft and turn it into a rhythm challenge you can play offline."
  >
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      background: #171329;
      color: #ffffff;
      text-align: center;
    }

    .container {
      max-width: 620px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 48px;
    }

    .tagline {
      margin: 0 0 28px;
      font-size: 20px;
      line-height: 1.6;
    }

    .description {
      margin: 0 auto 20px;
      max-width: 560px;
      font-size: 16px;
      line-height: 1.7;
      color: #d8d3e8;
    }

    .button {
      display: inline-block;
      margin-top: 12px;
      padding: 14px 28px;
      border-radius: 12px;
      background: #8b6cff;
      color: #ffffff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
    }

    .button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>BeatShyft</h1>

    <p class="tagline">
      Bring Your Favorite Songs to The Game!
    </p>

    <p class="description">
      Bring your favorite music to BeatShyft and turn it into a rhythm
      challenge you can play offline.
    </p>

    <p class="description" dir="rtl">
      آهنگ مورد علاقه‌تان را وارد BeatShyft کنید و به یک بازی ریتمیک آفلاین تبدیلش کنید.
    </p>

    <a
      class="button"
      href="https://github.com/Katiiz/BeatShyft/releases/latest"
    >
      Download BeatShyft
    </a>
  </main>
</body>
</html>
